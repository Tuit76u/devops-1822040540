name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiem tra du file
        run: |
          if [ ! -f "index.html" ] || [ ! -f "style.css" ] || [ ! -f "script.js" ]; then
            echo "❌ Thieu file he thong"
            exit 1
          fi
          echo "✅ Du 3 file"

      - name: Kiem tra the title
        run: |
          if ! grep -q "<title>" index.html; then
            echo "❌ index.html thieu the <title>"
            exit 1
          fi
          echo "✅ Co the title"

  # ===== JOB 2: DEPLOY (đây là phần CD) =====
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4